name: Marketplace Ad Sender

run-name: >-
  ${{
    (github.event.inputs.ad_type == 'sell'
      && format('💰 SELL BB @ {0}/1K', github.event.inputs.sell_rate || '2.5$')
      || (github.event.inputs.buy_style == 'simple'
        && format('🛒 BUY ALL BB | {0}', github.event.inputs.buy_extra || 'DM ME QUICK')
        || format('🛒 BUY BB @ tok {0}/1K · rap {1}/1K',
                  github.event.inputs.buy_rate || '2.2',
                  github.event.inputs.buy_rate_rap || '1.8')))
  }}
  | ${{ github.event.inputs.interval_min }}min × ${{ github.event.inputs.total_hours }}h
  ${{ ((github.event.inputs.ad_type == 'sell' || github.event.inputs.buy_style == 'simple') && github.event.inputs.attach_image == 'yes') && '| 📷img' || '' }}
  ${{ (github.event.inputs.channel_1 || github.event.inputs.channel_2) && '| 🎯 1-2 channels' || '' }}

on:
  workflow_dispatch:
    inputs:
      ad_type:
        description: 'Ad type (SELL or BUY)'
        required: true
        default: 'sell'
        type: choice
        options:
          - 'sell'
          - 'buy'

      # ---- SELL options ----
      sell_rate:
        description: '[SELL] Rate (e.g. 2.5$) — used in "SELLING BB LF X/1K"'
        required: false
        default: '2.5$'
        type: string
      sell_extra:
        description: '[SELL] Extra text after the rate'
        required: false
        default: 'DM ME QUICK CAN DO SMALL AND BIG AMOUNTS'
        type: string

      # ---- BUY options ----
      buy_style:
        description: '[BUY] Style: detailed = multi-line bullets (text-only), simple = single line (image OK)'
        required: false
        default: 'detailed'
        type: choice
        options:
          - 'detailed'
          - 'simple'
      buy_rate:
        description: '[BUY detailed] Tokens rate (e.g. 2.2)'
        required: false
        default: '2.2'
        type: string
      buy_rate_rap:
        description: '[BUY detailed] RAP rate (e.g. 1.8)'
        required: false
        default: '1.8'
        type: string
      buy_simple_text:
        description: '[BUY simple] Full message (e.g. BUYING ALL BLADE BALL DM ME QUICK)'
        required: false
        default: 'BUYING ALL BLADE BALL DM ME QUICK'
        type: string

      # ---- Targeting ----
      channel_1:
        description: '[Optional] Single channel ID — if set, posts ONLY to this (and channel_2 if provided) instead of CHANNEL_IDS secret'
        required: false
        default: ''
        type: string
      channel_2:
        description: '[Optional] Second channel ID (leave blank to post to just channel_1)'
        required: false
        default: ''
        type: string

      # ---- Timing ----
      interval_min:
        description: 'Minutes between posts per channel (randomized ±25%)'
        required: false
        default: '5'
        type: choice
        options:
          - '3'
          - '5'
      total_hours:
        description: 'Total runtime (chained 6h chunks — max 48h)'
        required: false
        default: '6'
        type: choice
        options:
          - '6'
          - '12'
          - '18'
          - '24'
          - '48'
      attach_image:
        description: 'Attach image? (SELL always respects this; BUY simple respects this; BUY detailed is always text-only)'
        required: false
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'

concurrency:
  group: ad-sender-global
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.calc.outputs.chunks }}
    steps:
      - id: calc
        shell: bash
        run: |
          set -euo pipefail
          HOURS="${{ github.event.inputs.total_hours }}"
          CHUNKS=$(( (HOURS + 5) / 6 ))
          if [ "$CHUNKS" -gt 8 ]; then CHUNKS=8; fi
          echo "chunks=$CHUNKS" >> "$GITHUB_OUTPUT"
          echo "🗓️  ${{ github.event.inputs.ad_type }} @ ${HOURS}h = $CHUNKS chunk(s)"

  send-chunk:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 380
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        chunk: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Check if this chunk should run
        id: check
        shell: bash
        run: |
          set -euo pipefail
          MAX="${{ needs.plan.outputs.chunks }}"
          CHUNK="${{ matrix.chunk }}"
          if [ -z "$MAX" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ chunks output was empty; skipping."
          elif [ "$CHUNK" -gt "$MAX" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Skipping chunk $CHUNK (only $MAX needed)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "✅ Chunk $CHUNK / $MAX"
          fi

      - name: Gap between chunks
        if: steps.check.outputs.skip == 'false' && matrix.chunk > 1
        shell: bash
        run: |
          WAIT=$(( RANDOM % 181 + 120 ))
          echo "⏳ ${WAIT}s gap between chunks (simulating reconnect)..."
          sleep "$WAIT"

      - name: Checkout code
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: pip install --quiet 'curl-cffi>=0.10' 'Pillow>=10.0' 'websocket-client>=1.6'

      # Resolve which channels to post to. If channel_1/channel_2 are filled in
      # the Run Workflow form, they OVERRIDE the CHANNEL_IDS secret for this run.
      # Otherwise, use the full list from the secret as usual.
      - name: Resolve target channels
        if: steps.check.outputs.skip == 'false'
        id: channels
        shell: bash
        env:
          CH1: ${{ github.event.inputs.channel_1 }}
          CH2: ${{ github.event.inputs.channel_2 }}
          SECRET_IDS: ${{ secrets.CHANNEL_IDS }}
        run: |
          set -euo pipefail
          clean() { echo "${1//$'\r'/}" | tr -d '\n '; }
          C1="$(clean "$CH1")"
          C2="$(clean "$CH2")"

          if [ -n "$C1" ] || [ -n "$C2" ]; then
            # Per-run override
            CIDS=""
            [ -n "$C1" ] && CIDS="$C1"
            [ -n "$C2" ] && CIDS="${CIDS:+$CIDS,}$C2"
            echo "🎯 Using per-run channels: $CIDS"
          else
            # Default: full list from secret
            CIDS="$(clean "$SECRET_IDS")"
            echo "📡 Using full CHANNEL_IDS secret"
          fi

          if [ -z "$CIDS" ]; then
            echo "::error::No channels configured. Fill CHANNEL_IDS secret or channel_1/channel_2 inputs."
            exit 1
          fi
          echo "channels<<CH_EOF" >> "$GITHUB_OUTPUT"
          echo "$CIDS" >> "$GITHUB_OUTPUT"
          echo "CH_EOF" >> "$GITHUB_OUTPUT"

      # Build the ad message inside this job (avoids cross-job multiline-output
      # edge cases and keeps IMAGE_FILENAME secret out of job outputs).
      - name: Build message + resolve image
        if: steps.check.outputs.skip == 'false'
        id: build
        shell: bash
        env:
          AD_TYPE: ${{ github.event.inputs.ad_type }}
          SELL_RATE: ${{ github.event.inputs.sell_rate }}
          SELL_EXTRA: ${{ github.event.inputs.sell_extra }}
          BUY_STYLE: ${{ github.event.inputs.buy_style }}
          BUY_RATE: ${{ github.event.inputs.buy_rate }}
          BUY_RAP: ${{ github.event.inputs.buy_rate_rap }}
          BUY_SIMPLE_TEXT: ${{ github.event.inputs.buy_simple_text }}
          ATTACH: ${{ github.event.inputs.attach_image }}
          IMAGE_FILENAME: ${{ secrets.IMAGE_FILENAME }}
        run: |
          set -euo pipefail
          clean() { echo "${1//$'\r'/}" | tr -d '\n'; }

          AD_TYPE_C="$(clean "$AD_TYPE")"
          SELL_RATE_C="$(clean "$SELL_RATE")"
          SELL_EXTRA_C="$(clean "$SELL_EXTRA")"
          BUY_STYLE_C="$(clean "$BUY_STYLE")"
          BUY_RATE_C="$(clean "$BUY_RATE")"
          BUY_RAP_C="$(clean "$BUY_RAP")"
          BUY_SIMPLE_C="$(clean "$BUY_SIMPLE_TEXT")"
          ATTACH_C="$(clean "$ATTACH")"
          IMAGE_FILENAME_C="$(clean "$IMAGE_FILENAME")"

          if [ "$AD_TYPE_C" = "sell" ]; then
            MSG="$(printf 'SELLING BB LF %s/1K %s' "$SELL_RATE_C" "$SELL_EXTRA_C")"
            HAS_IMAGE="$ATTACH_C"
          elif [ "$BUY_STYLE_C" = "simple" ]; then
            # Single-line buy (e.g. "BUYING ALL BLADE BALL DM ME QUICK") — image allowed
            MSG="$BUY_SIMPLE_C"
            HAS_IMAGE="$ATTACH_C"
          else
            # Multi-line bullet buy — text only (images on multi-line look off)
            MSG="$(printf 'BUYING BLADE BALL:\n\n-TOKENS %s/1K\n\n-RAP %s$/1K (nlf boosted)\n\nDM me quick' \
                   "$BUY_RATE_C" "$BUY_RAP_C")"
            HAS_IMAGE="no"
          fi

          CHAR_COUNT="${#MSG}"
          LINE_COUNT="$(printf '%s\n' "$MSG" | wc -l)"
          echo "Ad type : $AD_TYPE_C (style: ${BUY_STYLE_C:---})"
          echo "Lines   : $LINE_COUNT"
          echo "Chars   : $CHAR_COUNT"
          echo "Image   : $HAS_IMAGE"
          echo "--- Message ---"
          echo "$MSG"
          echo "---------------"

          if [ "$CHAR_COUNT" -gt 1900 ]; then
            echo "::error::Message too long ($CHAR_COUNT chars, max 1900)."
            exit 1
          fi
          if [ -z "$MSG" ]; then
            echo "::error::Constructed message is empty!"
            exit 1
          fi

          if [ "$HAS_IMAGE" = "yes" ]; then
            if [ -n "$IMAGE_FILENAME_C" ]; then
              IMG_PATH="$IMAGE_FILENAME_C"
            else
              IMG_PATH="ad.png"
            fi
          else
            IMG_PATH=""
          fi
          echo "Image path: '${IMG_PATH}'"

          DELIM="EOF_$(openssl rand -hex 8 2>/dev/null || echo "9f8e7d6c5b4a3210")"
          {
            echo "msg<<${DELIM}"
            echo "$MSG"
            echo "${DELIM}"
            echo "ad_type=${AD_TYPE_C}"
            echo "has_image=${HAS_IMAGE}"
            echo "image_path=${IMG_PATH}"
          } >> "$GITHUB_OUTPUT"

      - name: Run ad sender (6h chunk)
        if: steps.check.outputs.skip == 'false'
        env:
          USER_TOKEN: ${{ secrets.USER_TOKEN }}
          CHANNEL_IDS: ${{ steps.channels.outputs.channels }}
          AD_TYPE: ${{ steps.build.outputs.ad_type }}
          MESSAGE: ${{ steps.build.outputs.msg }}
          ATTACH_IMAGE: ${{ steps.build.outputs.has_image }}
          INTERVAL_MIN: ${{ github.event.inputs.interval_min }}
          TOTAL_RUN_MIN: 360
          IMAGE_PATH: ${{ steps.build.outputs.image_path }}
          CUSTOM_STATUS_TEXT: ${{ secrets.CUSTOM_STATUS_TEXT }}
          STATUS_EMOJI: ${{ secrets.STATUS_EMOJI }}
          MIN_AFK_BREAKS: ${{ secrets.MIN_AFK_BREAKS }}
          MAX_AFK_BREAKS: ${{ secrets.MAX_AFK_BREAKS }}
          AFK_MIN_MIN: ${{ secrets.AFK_MIN_MIN }}
          AFK_MAX_MIN: ${{ secrets.AFK_MAX_MIN }}
          DISCORD_LOCALE: ${{ secrets.DISCORD_LOCALE }}
          DISCORD_TIMEZONE: ${{ secrets.DISCORD_TIMEZONE }}
          DEBUG: ${{ secrets.DEBUG }}
          # Optional HTTPS proxy (residential). Format: http://user:pass@host:port
          # Leave the secret empty/absent to connect directly.
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          HTTP_PROXY: ${{ secrets.HTTPS_PROXY }}
          # v5.0/v5.1 anti-detection knobs (all optional, sane defaults if empty)
          WARMUP_POSTS: ${{ secrets.WARMUP_POSTS }}
          STRIP_EXIF: ${{ secrets.STRIP_EXIF }}
          RANDOM_REACT: ${{ secrets.RANDOM_REACT }}
          PROXY_CHECK: ${{ secrets.PROXY_CHECK }}
          ENABLE_GATEWAY: ${{ secrets.ENABLE_GATEWAY }}
          TYPO_EDIT_CHANCE: ${{ secrets.TYPO_EDIT_CHANCE }}
          IMAGE_JITTER: ${{ secrets.IMAGE_JITTER }}
          SUPPRESS_EMBEDS: ${{ secrets.SUPPRESS_EMBEDS }}
          PYTHONUNBUFFERED: '1'
        run: |
          echo "=== chunk ${{ matrix.chunk }} starting at $(date -u +%H:%M:%SZ) ==="
          python -u send_ads.py
